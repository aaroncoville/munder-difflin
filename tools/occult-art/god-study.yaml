# The god's study — the keeper's desk under the sea windows, with his book open on it.
#
# The sheet the shipped panel was generated from. Reproduce it with the call in
# this directory's README.
#
# This is the second painting of the room. The first put a quill and an inkwell
# on the desk and nothing to read, so the keeper's seat was the one desk in the
# house with no painted book: his commission was drawn over bare wood with a
# page turned by a keyframe, while every reading desk turned its own painted
# book on film. The reference is therefore not a photograph but that first
# panel, which shipped in this repository; the digest below is its bytes, so it
# can be recovered from history and confirmed before a repaint is attempted.
panel: src/renderer/src/scene/study/assets/room-god-study.png
model: black-forest-labs/flux-kontext-pro
input:
  prompt: |-
    Keep this room EXACTLY as it is — same walls, same arched windows and sea view, same bookcase, same beams, same rug, same desk in the same place and size, same inkstand and quill, same composition and framing. Make ONE change only: add a large OPEN BOOK lying flat on the front centre of the desktop, its two cream pages spread open and facing the viewer, with a deep red binding, sitting between the inkstand and the quill and clearly on the desk surface. Keep the exact flat 2D storybook illustration style, matte flat colours, soft paper grain and thin clean outlines of the input. No people, no readable text.
  aspect_ratio: "21:9"
  output_format: png
  input_image: "the reference below, supplied inline as a data: URI"
