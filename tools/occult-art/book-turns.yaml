# The page turns — one short film per reading desk, of that desk's own painting.
#
# The book on a reading desk used to turn its pages with shapes of ours: two
# cream rectangles and a third swinging across them on a CSS keyframe, laid over
# the volume the painter had already drawn there. These clips are the painting
# itself in motion instead — each one generated FROM the panel it plays over, so
# what moves on the desk is that room's own book in that room's own colours.
#
# Unlike the panels, these are reproducible: the model takes a seed, and every
# input that decides a clip is recorded below.
model: wan-video/wan-2.2-i2v-fast
input:
  prompt: |-
    A single page of the open book turns: one leaf lifts from the right-hand page, sweeps across the spine and settles onto the left-hand page. The camera is completely locked off and static — no zoom, no push in, no pull back, no pan, no camera movement of any kind. The desk, the chair and the wall do not move or change at all. Flat 2D storybook illustration: naive simple shapes, matte flat colours with soft paper grain, thin clean outlines, no realistic lighting, no 3D rendering, no photorealism.
  resolution: "480p"
  num_frames: 81      # the model's floor; a shorter request is refused outright
  go_fast: true
  # The loop lever. This model takes a LAST frame as well as a first, and
  # passing the same image as both conditions the clip to come back to the
  # painting's own pixels — which is what lets it repeat without a cut.
  image: the crop below, as a data: URI
  last_image: the same image
output:
  width: 832
  height: 464         # NOT the 854x480 that goes in: the model picks the bucket
  duration: 5.06s

# Reproducing one clip:
#
#   sips -c 162 288 --cropOffset <y> <x> <panel> --out crop.png
#   sips -z 480 854 crop.png --out in.png
#   curl -s -X POST https://api.replicate.com/v1/models/wan-video/wan-2.2-i2v-fast/predictions \
#     -H "Authorization: Bearer $(cat ~/.config/replicate/token)" \
#     -H 'Content-Type: application/json' -H 'Prefer: wait' \
#     -d "$(jq -n --arg p "$PROMPT" --arg img "data:image/png;base64,$(base64 -i in.png)" --argjson s <seed> \
#           '{input:{prompt:$p,image:$img,last_image:$img,resolution:"480p",num_frames:81,seed:$s,go_fast:true}}')"
#
# THE CROP IS DATA, NOT ARITHMETIC. It is not derived from the painted volume,
# and it is not the same rectangle in every room. Each was chosen to hold the
# book with room above it for a page to rise into, WHILE keeping that room's
# candle out of frame — because the model animates whatever else is in shot, and
# a flame it invented would burn beside the one the ambiance layer already draws
# at the manifest's own light point. Four of the eight desks have a candle close
# enough that the window had to be pushed off-centre to exclude it; at berth-5
# the flame is 17px from the book and the crop's left edge sits flush with it.
#
# The same rectangles are carried in the room manifest as each berth's `turn`,
# which is what the scene draws against. This file is why they are those values.
berths:
  berth-1:
    panel: src/renderer/src/scene/study/assets/room-desk-a.png
    clip: src/renderer/src/scene/study/assets/book-turn-berth-1.mp4
