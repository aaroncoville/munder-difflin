# What the clips are NOT, measured rather than assumed:
#
#   - Not byte-identical to the panel. Frame 0 differs from the crop it was made
#     from by a mean of 4.1-6.7 / 255 across the eight, with a worst pixel in the
#     low tens — a flat level shift from the model and the codec, not a change of
#     content. The scene answers that by FEATHERING the clip into the painting
#     rather than butting a hard rectangle against it, and by drawing no clip at
#     all on a desk at rest, so a quiet desk is the panel exactly as painted.
#   - Not drifting. Measured over regions the turning page cannot reach, the
#     worst frame of each clip differs from its first by a worst PIXEL of 8-20,
#     and the desk's front edge moves under 0.05px. Nothing in the frame is
#     moving except the page.
